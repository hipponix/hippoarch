# HippoArch Profile: CWWK Server
DISK="/dev/nvme0n1"   # Target install disk. Run `lsblk` to confirm. e.g. /dev/sda, /dev/nvme0n1
HOSTNAME="arch-server" # Machine hostname. e.g. arch-server, nas-home
USERNAME="user"        # Primary user account name. e.g. admin, naspar
ROOT_PASSWORD="changeme" # Root account password. Change before running the bootstrap
USER_PASSWORD="changeme" # Primary user password. Change before running the bootstrap
TIMEZONE="UTC"         # Timezone string. e.g. Europe/Rome, America/New_York, UTC
LOCALE="en_US.UTF-8"  # System locale. e.g. en_US.UTF-8, it_IT.UTF-8, de_DE.UTF-8
LAYOUT="btrfs"         # Partition layout. Options: simple (EFI + ext4), btrfs (EFI + btrfs with subvolumes)

# Services: "package:service" pairs — colon only when the package name differs from the service name
SERVICES="openssh:sshd"

# Features
ENABLE_FANCONTROL=1    # Set to 1 to load it87, configure lm_sensors and fancontrol
IT87_FORCE_ID=0x8786  # Force it87 driver chip ID — IT8784 chip on CWWK responds to IT8786E driver
ENABLE_AIDE=1          # Set to 1 to install aide and initialise the integrity database
ENABLE_AUR=1           # Set to 1 to allow installing AUR packages (required for aide and it87-dkms-git)

# Extra packages installed via pacstrap (space-separated)
EXTRA_PACKAGES=""

# Custom script to run at the end of provision (leave empty if not needed)
CUSTOM_SCRIPT=""
