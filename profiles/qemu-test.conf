# HippoArch Profile: QEMU integration test
# Used exclusively by tests/integration/run.sh — do not run on real hardware.
DISK="/dev/vda"             # virtio disk exposed by QEMU (-drive if=virtio)
HOSTNAME="hippoarch-qemu"   # VM hostname
USERNAME="testuser"         # Primary user created inside the VM
ROOT_PASSWORD="hippoarch-test-root" # Known password — safe because the VM is ephemeral
USER_PASSWORD="hippoarch-test-user" # Known password — safe for the same reason
TIMEZONE="UTC"
LOCALE="en_US.UTF-8"
LAYOUT="simple"             # EFI + ext4; simpler to verify than btrfs in integration tests

# Services: openssh installed via pacstrap so SSH is available before provision.sh runs
SERVICES="openssh:sshd"

# linux-firmware is ~700 MB of real hardware firmware — unnecessary in a VM
BASE_PKGS_REMOVE="linux-firmware"
