# HippoArch Profile: Workstation
# Edit for your machine, then: bash bootstrap.sh profiles/workstation.conf
#
# Find your target disk: lsblk

DISK="/dev/sda"        # Target install disk. Run `lsblk` to confirm.
HOSTNAME="arch-workstation"
USERNAME="user"
ROOT_PASSWORD="changeme"
USER_PASSWORD="changeme"
TIMEZONE="UTC"
LOCALE="en_US.UTF-8"
LAYOUT="simple"

# Services: "package:service" pairs — colon only when the package name differs from the service name
SERVICES=""

# Features
ENABLE_KDE=1           # Set to 1 to install KDE Plasma and enable sddm
ENABLE_FANCONTROL=0
ENABLE_AIDE=0

# Extra packages installed via pacstrap (space-separated)
EXTRA_PACKAGES="man-db man-pages"

# Custom script to run at the end of provision (leave empty if not needed)
CUSTOM_SCRIPT=""
