name: HippoArch CI

on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ''
          filters: |
            code:
              - '!(README.md|docs/**|.github/ISSUE_TEMPLATE/**)'
            install:
              - 'bootstrap.sh'
              - 'provision.sh'
              - 'lib/**'
              - 'profiles/**'
              - 'common/**'
              - 'roles/**'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint
        run: make lint

      - name: Security Scan
        run: make security

      - name: Syntax Check
        run: make test-syntax

  unit:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Unit Tests
        run: make test-unit

  functional:
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Functional Tests
        run: make test-functional

  integration:
    runs-on: ubuntu-latest
    needs: [unit, functional, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.install == 'true'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf libarchive-tools expect openssh-client python3

      - name: Get current month
        id: date
        run: echo "month=$(date +%Y-%m)" >> $GITHUB_OUTPUT

      - name: Cache Arch ISO
        uses: actions/cache@v4
        with:
          path: .cache/arch-latest.iso
          key: arch-iso-${{ steps.date.outputs.month }}

      - name: Integration test
        run: make HEADLESS=1 test-integration

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: tests/integration/logs/
