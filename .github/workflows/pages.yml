name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject README as index
        run: |
          printf -- '---\nlayout: default\ntitle: HippoArch\n---\n' | cat - README.md > docs/index.md

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

      - id: deploy
        uses: actions/deploy-pages@v4
