<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  document.querySelectorAll('.language-mermaid').forEach(function (el) {
    var div = document.createElement('div');
    div.className = 'mermaid';
    var code = el.querySelector('code');
    div.textContent = code ? code.textContent : el.textContent;
    el.replaceWith(div);
  });
  mermaid.run();
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var headings = document.querySelectorAll('section h2');
  if (!headings.length) return;
  var nav = document.createElement('nav');
  var ul = document.createElement('ul');
  headings.forEach(function (h) {
    if (!h.id) {
      h.id = h.textContent.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
    }
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    ul.appendChild(li);
  });
  nav.appendChild(ul);
  document.querySelector('header').appendChild(nav);
});
</script>
